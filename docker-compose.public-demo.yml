services:
  backend:
    build:
      context: .
      dockerfile: deploy/render/backend.Dockerfile
    environment:
      APP_ENV: demo
      AUTH_SECRET: ${PUBLIC_DEMO_AUTH_SECRET:-local-public-demo-secret}
      AI_PROVIDER: mock
      AVATAR_PROVIDER: static_2d
      STT_PROVIDER: browser
      CORS_ORIGINS: http://127.0.0.1:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        INTERNAL_API_BASE_URL: http://backend:10000
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://frontend:3000
    depends_on:
      frontend:
        condition: service_healthy

