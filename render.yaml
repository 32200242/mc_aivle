services:
  - type: web
    name: family-center-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: demo
      - key: CORS_ORIGINS
        value: https://family-center-ai-web.onrender.com
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: AVATAR_PROVIDER
        value: static_2d
      - key: STT_PROVIDER
        value: browser

  - type: web
    name: family-center-ai-web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://family-center-ai-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_PUBLIC_DEMO
        value: "true"
